name: Windows application

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-build.txt
      - name: Build and check portable application
        shell: pwsh
        run: ./build.ps1 -Python python
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deckviewer-windows-x64
          path: |
            dist/deckviewer-windows-x64.zip
            dist/deckviewer-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-build-diagnostics
          path: |
            build/smoke-result.json
            build/smoke-data/logs/
            build/deckviewer/warn-deckviewer.txt
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: deckviewer-windows-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "DeckViewer $RELEASE_TAG" --generate-notes
          fi
